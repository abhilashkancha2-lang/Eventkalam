<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventKalam | Discover Events</title>
<style>
:root{--ink:#17233b;--muted:#68758b;--brand:#635bdb;--brand2:#8a5cf6;--bg:#f5f7fc;--line:#e8ebf3;--white:#fff;--green:#15966b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:22px}.logo{font-size:23px;font-weight:850;color:var(--brand);letter-spacing:-1px;cursor:pointer}.logo span{color:#f09b42}.links{display:flex;gap:5px;flex:1}.links button,.navright button{background:transparent;color:#46516a;padding:9px 11px;border-radius:10px}.links button:hover,.links button.active{background:#f0efff;color:var(--brand)}.navright{display:flex;gap:7px}.primary,.secondary,.danger{padding:10px 16px;border-radius:10px;font-weight:700}.primary{background:var(--brand);color:white;box-shadow:0 6px 16px #635bdb30}.primary:hover{background:#5048c5}.secondary{background:#efefff;color:var(--brand)}.danger{background:#fff0f0;color:#c43d4b}.container{max-width:1180px;margin:auto;padding:28px 22px 70px}.hero{background:linear-gradient(120deg,#252d63,#6256d7 62%,#9b66e9);color:white;border-radius:24px;padding:48px;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:300px;height:300px;border:50px solid #ffffff15;border-radius:50%;right:7%;top:-85px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#d7d4ff}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.08;margin:12px 0;letter-spacing:-1.8px;max-width:650px}.hero p{color:#e0dfff;max-width:540px}.searchbox{display:flex;background:white;padding:7px;border-radius:13px;max-width:660px;margin-top:23px;gap:6px}.searchbox input{border:0;outline:0;flex:1;min-width:0;padding:9px 12px;color:var(--ink)}.heroart{display:grid;place-items:center;font-size:125px;position:relative;z-index:1}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:23px 0}.filters input,.filters select,.field input,.field select,.field textarea,.searchline input{border:1px solid var(--line);background:white;border-radius:10px;padding:11px 13px;color:var(--ink);outline-color:#aaa4ff}.filters input{flex:1;min-width:200px}.filters select{min-width:145px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:28px 0 15px;gap:12px}.sectionhead h2{font-size:24px;margin:0;letter-spacing:-.6px}.muted{color:var(--muted)}.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.cat{border:1px solid var(--line);background:white;border-radius:15px;padding:17px 10px;text-align:center;color:var(--ink);font-weight:700}.cat b{display:block;font-size:28px;margin-bottom:5px}.cat.selected,.cat:hover{border-color:#a9a4ff;background:#f0efff;color:var(--brand)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.event{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 5px 20px #1e2a4b08;display:flex;flex-direction:column}.poster{height:155px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#dfe9ff,#f3e5ff);position:relative}.poster .datebadge{position:absolute;left:12px;top:12px;background:white;border-radius:9px;padding:5px 9px;font-size:11px;font-weight:800;color:var(--brand)}.eventbody{padding:15px;display:flex;flex-direction:column;flex:1}.tag{font-size:11px;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:.7px}.event h3{margin:5px 0;font-size:18px}.eventfoot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:13px}.small{font-size:12px;color:var(--muted)}.price{font-weight:800}.pagehead{margin:4px 0 22px}.pagehead h1{font-size:32px;margin:0 0 4px;letter-spacing:-1px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:750}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:17px}.stat strong{font-size:27px;display:block}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);background:#fafbfe}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:40px;color:var(--muted);background:white;border:1px dashed #cfd5e3;border-radius:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17233b;color:white;padding:12px 18px;border-radius:12px;z-index:30;display:none;box-shadow:0 8px 30px #0003}.detail{display:grid;grid-template-columns:1fr 1fr;gap:22px}.detailposter{min-height:300px;border-radius:17px;background:linear-gradient(135deg,#dfe9ff,#f2dcff);display:grid;place-items:center;font-size:100px}.footer{text-align:center;color:var(--muted);padding:25px;border-top:1px solid var(--line)}.mobilemenu{display:none}
@media(max-width:800px){.links{display:none}.mobilemenu{display:block;margin-left:auto}.nav{gap:10px}.navright{display:none}.hero{grid-template-columns:1fr;padding:30px}.heroart{display:none}.cards{grid-template-columns:repeat(2,1fr)}.categories{grid-template-columns:repeat(3,1fr)}.detail{grid-template-columns:1fr}}
@media(max-width:520px){.container{padding:19px 14px 50px}.nav{padding:11px 14px}.cards{grid-template-columns:1fr}.hero{padding:25px 20px}.hero h1{font-size:35px}.formgrid,.stats{grid-template-columns:1fr}.sectionhead{align-items:start;flex-direction:column}.categories{gap:8px}.cat{padding:12px 5px;font-size:12px}}
</style>
</head>
<body>
<header class="top"><nav class="nav"><div class="logo" onclick="go('home')">Event<span>K</span>alam</div>
<div class="links" id="links"><button data-page="home" onclick="go('home')">Home</button><button data-page="explore" onclick="go('explore')">Explore Events</button><button data-page="create" onclick="go('create')">Create Event</button><button data-page="saved" onclick="go('saved')">Saved</button><button data-page="tickets" onclick="go('tickets')">My Registrations</button><button data-page="about" onclick="go('about')">About</button><button data-page="admin" onclick="go('admin')">Admin</button></div>
<button class="mobilemenu secondary" onclick="toggleMenu()">☰ Menu</button><div class="navright"><button onclick="go('login')">Log in</button><button class="primary" onclick="go('signup')">Sign up</button></div></nav><div id="mobilelinks" style="display:none;padding:0 14px 12px;flex-wrap:wrap;gap:5px"><button class="secondary" onclick="go('home')">Home</button><button class="secondary" onclick="go('explore')">Explore</button><button class="secondary" onclick="go('create')">Create</button><button class="secondary" onclick="go('saved')">Saved</button><button class="secondary" onclick="go('tickets')">Registrations</button><button class="secondary" onclick="go('about')">About</button><button class="secondary" onclick="go('admin')">Admin</button><button class="secondary" onclick="go('login')">Log in</button></div></header>
<main class="container" id="app"></main><footer class="footer">© 2026 EventKalam · Discover, learn, connect.</footer><div class="toast" id="toast"></div>
<script>
const seed=[
{id:1,title:"Hyderabad Innovation Summit",category:"Technology",date:"2026-10-18",time:"10:00",venue:"HITEX Exhibition Centre, Hyderabad",price:299,emoji:"🚀",description:"Explore emerging technology, innovation and ideas with interactive sessions and demonstrations.",organizer:"EventKalam",capacity:250},
{id:2,title:"Robotics Discovery Camp",category:"Robotics",date:"2026-10-22",time:"09:30",venue:"T-Hub, Hyderabad",price:199,emoji:"🤖",description:"A hands-on introduction to robotics, sensors, circuits and creative problem-solving.",organizer:"STEM Club",capacity:80},
{id:3,title:"AI & Machine Learning Bootcamp",category:"AI/ML",date:"2026-11-02",time:"10:00",venue:"JNTU Hyderabad",price:499,emoji:"🧠",description:"Learn AI and machine-learning foundations through guided activities and mini projects.",organizer:"Tech Academy",capacity:120},
{id:4,title:"Student Hackathon 2026",category:"Hackathon",date:"2026-11-12",time:"09:00",venue:"University Campus, Hyderabad",price:0,emoji:"💻",description:"Collaborate in teams to design and present solutions to practical challenges.",organizer:"Innovation Cell",capacity:150},
{id:5,title:"Young Entrepreneurs Meet",category:"Entrepreneurship",date:"2026-11-20",time:"11:00",venue:"Knowledge City, Hyderabad",price:149,emoji:"💡",description:"Discover business basics, idea validation and pathways for student innovation.",organizer:"Startup Circle",capacity:100},
{id:6,title:"School & College Science Expo",category:"School & College",date:"2026-12-04",time:"10:30",venue:"Public Gardens, Hyderabad",price:50,emoji:"🔬",description:"A showcase of student science models, experiments and creative projects.",organizer:"Science Forum",capacity:300}
];
let events=JSON.parse(localStorage.getItem("ek_events")||"null")||seed;
let saved=JSON.parse(localStorage.getItem("ek_saved")||"[]"),regs=JSON.parse(localStorage.getItem("ek_regs")||"[]"),page="home",activeCat="All",query="",selected=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){localStorage.setItem("ek_events",JSON.stringify(events));localStorage.setItem("ek_saved",JSON.stringify(saved));localStorage.setItem("ek_regs",JSON.stringify(regs))}
function toast(t){let e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
function toggleMenu(){let e=$("#mobilelinks");e.style.display=e.style.display==="flex"?"none":"flex"}
function go(p){page=p;$("#mobilelinks").style.display="none";render();window.scrollTo(0,0)}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function filtered(list=events){return list.filter(e=>(activeCat==="All"||e.category===activeCat)&&(`${e.title} ${e.category} ${e.venue} ${e.description}`).toLowerCase().includes(query.toLowerCase()))}
function cards(list){if(!list.length)return '<div class="empty">No events found. Try changing your search or filters.</div>';return '<div class="cards">'+list.map(e=>`<article class="event"><div class="poster"><span>${e.emoji||"🎟️"}</span><span class="datebadge">${fmt(e.date)}</span></div><div class="eventbody"><div class="tag">${esc(e.category)}</div><h3>${esc(e.title)}</h3><div class="small">📍 ${esc(e.venue)}</div><p class="muted">${esc(e.description)}</p><div class="eventfoot"><span class="price">${Number(e.price)===0?"Free":"₹"+esc(e.price)}</span><div><button class="secondary" onclick="saveEvent(${e.id})">${saved.includes(e.id)?"♥ Saved":"♡ Save"}</button> <button class="primary" onclick="detail(${e.id})">Details</button></div></div></div></article>`).join("")+'</div>'}
function searchPanel(){return `<div class="filters"><input placeholder="Search events, topics or venues…" value="${esc(query)}" oninput="query=this.value;render()"><select onchange="activeCat=this.value;render()">${["All","Technology","Robotics","AI/ML","Hackathon","Entrepreneurship","School & College","Workshop","Training"].map(c=>`<option ${activeCat===c?"selected":""}>${c}</option>`).join("")}</select><select id="sort" onchange="sortEvents(this.value)"><option value="date">Date: soonest</option><option value="price">Price: low to high</option><option value="title">Name: A–Z</option></select></div>`}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let a=$("#app");
if(page==="home"){a.innerHTML=`<section class="hero"><div><div class="eyebrow">Discover · Learn · Connect</div><h1>Discover events that bring communities together.</h1><p>Find workshops, robotics camps, AI/ML bootcamps, hackathons, entrepreneurship programmes, and school and college events.</p><div class="searchbox"><input id="heroSearch" placeholder="Search events, artists or venues" onkeydown="if(event.key==='Enter'){query=this.value;go('explore')}"><button class="primary" onclick="query=$('#heroSearch').value;go('explore')">Search</button></div><p class="small" style="color:#e0dfff">📍 Hyderabad, Telangana · Explore opportunities around you</p></div><div class="heroart">🎪</div></section><div class="sectionhead"><div><h2>Browse categories</h2><div class="muted">Find something that interests you</div></div></div><div class="categories">${[["All","✨"],["Technology","💻"],["Robotics","🤖"],["AI/ML","🧠"],["Hackathon","⚡"],["School & College","🎓"]].map(([c,i])=>`<button class="cat" onclick="activeCat='${c}';go('explore')"><b>${i}</b>${c==="All"?"All Events":c}</button>`).join("")}</div><div class="sectionhead"><div><h2>Featured events</h2><div class="muted">Explore upcoming opportunities</div></div><button class="secondary" onclick="go('explore')">View all →</button></div>${cards(events.slice().sort((x,y)=>x.date.localeCompare(y.date)).slice(0,3))}`}
else if(page==="explore"){a.innerHTML=`<div class="pagehead"><h1>Explore Events</h1><div class="muted">Search, filter and discover upcoming events.</div></div>${searchPanel()}<div class="sectionhead"><h2>All events <span class="muted" style="font-size:14px">(${filtered().length})</span></h2></div><div id="eventcards">${cards(filtered().sort((x,y)=>x.date.localeCompare(y.date)))}</div>`}
else if(page==="detail"){let e=events.find(x=>x.id===selected);if(!e){go("explore");return}a.innerHTML=`<button class="secondary" onclick="go('explore')">← Back to events</button><div class="panel detail" style="margin-top:16px"><div class="detailposter">${e.emoji||"🎟️"}</div><div><div class="tag">${esc(e.category)}</div><h1>${esc(e.title)}</h1><p class="muted">${esc(e.description)}</p><p>📅 <b>${fmt(e.date)} · ${esc(e.time||"Time TBA")}</b></p><p>📍 ${esc(e.venue)}</p><p>👥 Capacity: ${esc(e.capacity||"Not specified")}</p><p>Organizer: ${esc(e.organizer||"EventKalam")}</p><h2>${Number(e.price)===0?"Free":"₹"+esc(e.price)}</h2><div class="actions"><button class="primary" onclick="registerFor(${e.id})">Register for event</button><button class="secondary" onclick="saveEvent(${e.id})">${saved.includes(e.id)?"♥ Saved":"♡ Save event"}</button></div></div></div>`}
else if(page==="register"){let e=events.find(x=>x.id===selected);a.innerHTML=`<div class="pagehead"><h1>Event Registration</h1><div class="muted">Complete the form to register${e?" for "+esc(e.title):""}.</div></div><form class="panel" onsubmit="submitReg(event)"><div class="formgrid"><div class="field"><label>Full name *</label><input name="name" required placeholder="Enter your full name"></div><div class="field"><label>Email address *</label><input name="email" type="email" required placeholder="name@example.com"></div><div class="field"><label>Phone number *</label><input name="phone" type="tel" required pattern="[0-9+() -]{7,18}" placeholder="Enter phone number"></div><div class="field"><label>Education / Organization</label><input name="education" placeholder="School, college or organization"></div><div class="field full"><label>Select event *</label><select name="eventId" required>${events.map(x=>`<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(x.title)} · ${fmt(x.date)}</option>`).join("")}</select></div><div class="field full"><label>Additional note</label><textarea name="note" placeholder="Any details you would like to share"></textarea></div></div><div class="actions"><button class="primary" type="submit">Submit registration</button><button class="secondary" type="button" onclick="go('explore')">Cancel</button></div><p class="small">Demo frontend: registration is saved in this browser only. No payment is collected.</p></form>`}
else if(page==="create"){a.innerHTML=`<div class="pagehead"><h1>Create an Event</h1><div class="muted">Add an event to the EventKalam listing.</div></div><form class="panel" onsubmit="createEvent(event)"><div class="formgrid"><div class="field"><label>Event title *</label><input name="title" required placeholder="e.g. Web Development Workshop"></div><div class="field"><label>Category *</label><select name="category" required>${["Technology","Robotics","AI/ML","Hackathon","Entrepreneurship","School & College","Workshop","Training"].map(c=>`<option>${c}</option>`).join("")}</select></div><div class="field"><label>Date *</label><input name="date" type="date" min="2026-09-30" required></div><div class="field"><label>Time</label><input name="time" type="time"></div><div class="field"><label>Venue *</label><input name="venue" required placeholder="Event location"></div><div class="field"><label>Organizer</label><input name="organizer" placeholder="Organizer name"></div><div class="field"><label>Registration fee (₹)</label><input name="price" type="number" min="0" value="0"></div><div class="field"><label>Capacity</label><input name="capacity" type="number" min="1" placeholder="Maximum attendees"></div><div class="field full"><label>Description *</label><textarea name="description" required placeholder="Describe your event…"></textarea></div></div><div class="actions"><button class="primary">Publish event</button><button type="button" class="secondary" onclick="go('home')">Cancel</button></div></form>`}
else if(page==="saved"){a.innerHTML=`<div class="pagehead"><h1>Saved Events</h1><div class="muted">Events you have bookmarked.</div></div>${cards(events.filter(e=>saved.includes(e.id)))}`}
else if(page==="tickets"){a.innerHTML=`<div class="pagehead"><h1>My Registrations</h1><div class="muted">Your event registration history on this device.</div></div>${regs.length?`<div class="tablewrap"><table><thead><tr><th>Attendee</th><th>Event</th><th>Date</th><th>Email</th><th>Status</th></tr></thead><tbody>${regs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.eventTitle)}</td><td>${fmt(r.date)}</td><td>${esc(r.email)}</td><td><span class="tag">Registered</span></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">You have no registrations yet. <br><br><button class="primary" onclick="go(\'explore\')">Explore events</button></div>'}`}
else if(page==="admin"){a.innerHTML=`<div class="pagehead"><h1>Admin Dashboard</h1><div class="muted">Demo controls to manage events and registrations.</div></div><div class="stats"><div class="stat"><span class="muted">Total events</span><strong>${events.length}</strong></div><div class="stat"><span class="muted">Registrations</span><strong>${regs.length}</strong></div><div class="stat"><span class="muted">Saved events</span><strong>${saved.length}</strong></div></div><div class="sectionhead"><h2>Manage events</h2><button class="primary" onclick="go('create')">+ Create event</button></div><div class="tablewrap"><table><thead><tr><th>Event</th><th>Category</th><th>Date</th><th>Fee</th><th>Actions</th></tr></thead><tbody>${events.map(e=>`<tr><td><b>${esc(e.title)}</b><div class="small">${esc(e.venue)}</div></td><td>${esc(e.category)}</td><td>${fmt(e.date)}</td><td>${Number(e.price)?"₹"+esc(e.price):"Free"}</td><td><button class="secondary" onclick="detail(${e.id})">View</button> <button class="danger" onclick="deleteEvent(${e.id})">Delete</button></td></tr>`).join("")}</tbody></table></div><div class="sectionhead"><h2>Registration records</h2></div>${regs.length?`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Event</th></tr></thead><tbody>${regs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${esc(r.eventTitle)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No registrations yet.</div>'}<div class="actions"><button class="danger" onclick="resetDemo()">Reset demo data</button></div><p class="small">This is a frontend-only admin view, not secured. Add authentication and a backend before using it publicly.</p>`}
else if(page==="login"||page==="signup"){let sign=page==="signup";a.innerHTML=`<div class="pagehead"><h1>${sign?"Create your account":"Welcome back"}</h1><div class="muted">${sign?"Join EventKalam to explore and register for events.":"Log in to your EventKalam account."}</div></div><form class="panel" style="max-width:520px" onsubmit="demoAuth(event,${sign})"><div class="formgrid"><div class="field full">${sign?'<label>Full name</label><input name="name" required placeholder="Your name">':''}</div><div class="field full"><label>Email</label><input type="email" name="email" required placeholder="name@example.com"></div><div class="field full"><label>Password</label><input type="password" name="password" minlength="6" required placeholder="At least 6 characters"></div></div><div class="actions"><button class="primary">${sign?"Sign up":"Log in"}</button><button type="button" class="secondary" onclick="go('${sign?"login":"signup"}')">${sign?"Already have an account? Log in":"New to EventKalam? Sign up"}</button></div><p class="small">Demo only: no account is created and credentials are not sent to a server.</p></form>`}
else if(page==="about"){a.innerHTML=`<div class="pagehead"><h1>About EventKalam</h1><div class="muted">Discover opportunities. Build connections. Learn together.</div></div><div class="panel"><h2>What is EventKalam?</h2><p>EventKalam is an event-discovery frontend concept that helps students and communities explore workshops, robotics camps, AI/ML bootcamps, hackathons, entrepreneurship programmes, school and college events, and training sessions.</p><h2>What you can do</h2><ul><li>Search and filter events by category.</li><li>View event details and registration information.</li><li>Save events for later and review registrations.</li><li>Create event listings and manage them in the demo admin dashboard.</li></ul><p class="muted">This version stores demo data in your browser using local storage. It does not provide real authentication, online payments, or shared server data.</p></div>`}
}
function detail(id){selected=id;go("detail")}
function registerFor(id){selected=id;go("register")}
function saveEvent(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();render();toast(saved.includes(id)?"Event saved":"Removed from saved events")}
function submitReg(ev){ev.preventDefault();let f=new FormData(ev.target),e=events.find(x=>x.id===Number(f.get("eventId")));if(!e){toast("Please select an event");return}if(regs.some(r=>r.email.toLowerCase()===String(f.get("email")).toLowerCase()&&r.eventId===e.id)){toast("This email is already registered for this event");return}regs.push({id:Date.now(),name:f.get("name"),email:f.get("email"),phone:f.get("phone"),education:f.get("education"),note:f.get("note"),eventId:e.id,eventTitle:e.title,date:e.date});persist();toast("Registration saved successfully");go("tickets")}
function createEvent(ev){ev.preventDefault();let f=new FormData(ev.target),e={id:Date.now(),title:f.get("title"),category:f.get("category"),date:f.get("date"),time:f.get("time"),venue:f.get("venue"),organizer:f.get("organizer")||"Community Organizer",price:Number(f.get("price")||0),capacity:f.get("capacity"),description:f.get("description"),emoji:({Technology:"💻",Robotics:"🤖","AI/ML":"🧠",Hackathon:"⚡",Entrepreneurship:"💡","School & College":"🎓",Workshop:"🛠️",Training:"📘"})[f.get("category")]||"🎟️"};events.push(e);persist();toast("Event published in this browser");go("admin")}
function deleteEvent(id){if(!confirm("Delete this event and its registrations?"))return;events=events.filter(e=>e.id!==id);regs=regs.filter(r=>r.eventId!==id);saved=saved.filter(x=>x!==id);persist();render();toast("Event deleted")}
function resetDemo(){if(!confirm("Reset all demo data to the original events?"))return;events=seed.slice();saved=[];regs=[];persist();render();toast("Demo data reset")}
function demoAuth(ev,sign){ev.preventDefault();toast(sign?"Demo sign-up form validated":"Demo login form validated");go("home")}
function sortEvents(v){let list=filtered();if(v==="price")list.sort((a,b)=>a.price-b.price);if(v==="title")list.sort((a,b)=>a.title.localeCompare(b.title));if(v==="date")list.sort((a,b)=>a.date.localeCompare(b.date));$("#eventcards").innerHTML=cards(list)}
render();
</script></body></html>
